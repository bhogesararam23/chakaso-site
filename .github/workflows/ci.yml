name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Content invariants verification
        run: node scripts/verify-content-invariants.cjs

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Astro production build
        run: pnpm build

      - name: Verify internal link integrity
        run: node scripts/verify-links.cjs
